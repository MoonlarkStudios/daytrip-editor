[package]
name = "daytrip"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A quiet, native Markdown writing environment built with Iced"
license = "GPL-3.0-only"
publish = false

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["advanced", "wgpu", "tiny-skia", "crisp", "tokio", "markdown", "highlighter", "canvas", "image-without-codecs", "advanced-shaping", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = "0.12"
unicode-segmentation = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
rfd = "0.17.2"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync"] }
tempfile = "3"
directories = "6"
thiserror = "2"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yrs = { version = "=0.28.0", features = ["sync"] }
blake3 = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
ropey = "=1.6.1"
base64 = "=0.22.1"
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }

[dev-dependencies]
# Drive real asynchronous import tasks in application workflow tests.
iced_runtime = "0.14"
iced_tiny_skia = "0.14"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Narrow dependency fixes; provenance and removal policy in vendor/README.md.
[patch.crates-io]
yrs = { path = "vendor/yrs" }
cryoglyph = { path = "vendor/cryoglyph" }
iced_highlighter = { path = "vendor/iced_highlighter" }
