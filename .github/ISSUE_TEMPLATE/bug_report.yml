name: Bug report
description: Report a reproducible problem in Daytrip.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md instead of posting exploit details.
        Use synthetic Markdown and remove private paths and document contents from logs.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps and a minimal Markdown example that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/version, commit, Rust version, and Live/Source/Read mode.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Include relevant errors or a screenshot when useful.
